name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode Build Context
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate True Xcode Project Architecture
      run: xcodegen generate

    - name: Compile Official iOS App Bundle
      run: |
        # Compiles using Apple's standard compiler pipelines, cleanly linking SwiftUI, Metal, and VideoToolbox
        xcodebuild -project DatamoshCam.xcodeproj \
          -scheme DatamoshCam \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          clean build

    - name: Package Payload into Sideloadable IPA
      run: |
        mkdir -p build/Payload

        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*/Build/Products/Release-iphoneos/DatamoshCam.app" -print -quit)

        if [ -z "$APP_PATH" ]; then
          echo "ERROR: DatamoshCam.app was not found."
          find ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" -print
          exit 1
        fi

        echo "Found app at: $APP_PATH"
        cp -R "$APP_PATH" build/Payload/

        cd build
        zip -r DatamoshCam.ipa Payload/

    - name: Upload Installer IPA
      uses: actions/upload-artifact@v4
      with:
        name: DatamoshCam-installer
        path: build/DatamoshCam.ipa
