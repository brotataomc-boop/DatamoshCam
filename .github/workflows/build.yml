name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode Build Context
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate True Xcode Project Architecture
      run: xcodegen generate

    - name: Compile Official iOS App Bundle
      run: |
        # Compiles using Apple's standard compiler pipelines, cleanly linking SwiftUI, Metal, and VideoToolbox
        xcodebuild -project DatamoshCam.xcodeproj \
          -scheme DatamoshCam \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          clean build

    - name: Package Payload into Sideloadable IPA
      run: |
        mkdir -p build/Payload
        
        # Locates the natively built production app folder from the system build logs and clones it into place
        BUILD_DIR=$(xcodebuild -project DatamoshCam.xcodeproj -scheme DatamoshCam -showBuildSettings -configuration Release | grep -m 1 "TARGET_BUILD_DIR =" | cut -d\'=\' -f2 | xargs)
        cp -R "$BUILD_DIR/DatamoshCam.app" build/Payload/
        
        # Compresses into an installation file ready for AltStore
        cd build && zip -r DatamoshCam.ipa Payload/

    - name: Upload Installer IPA
      uses: actions/upload-artifact@v4
      with:
        name: DatamoshCam-installer
        path: build/DatamoshCam.ipa
