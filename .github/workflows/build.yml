name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Compile App via SwiftPM for iOS Device
      run: |
        # Builds the executable binary target targeting ARM64 physical architecture 
        swift build -c release \
          --triple arm64-apple-ios17.0 \
          -Xswiftc -sdk -Xswiftc "$(xcrun --sdk iphoneos --show-sdk-path)"

    - name: Package Payload into Sideloadable IPA
      run: |
        # Creates a clean app container layout mapping exactly to iOS launch specs
        mkdir -p build/Payload/DatamoshCam.app
        
        # Locates the compiled executable binary from the build cache and transfers it
        cp .build/arm64-apple-ios17.0/release/DatamoshCamApp build/Payload/DatamoshCam.app/DatamoshCam
        
        # Copies configuration assets into place
        cp Info.plist build/Payload/DatamoshCam.app/
        
        # Packages into an installer payload
        cd build && zip -r DatamoshCam.ipa Payload/

    - name: Upload Installer IPA
      uses: actions/upload-artifact@v4
      with:
        name: DatamoshCam-installer
        path: build/DatamoshCam.ipa
